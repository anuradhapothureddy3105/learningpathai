/* ---------------------------------------------------------------------- */
/*  SAFE STORAGE                                                          */
/*  window.storage only exists inside the Claude.ai artifact preview.     */
/*  Once this file is downloaded and opened as a normal page (or hosted   */
/*  anywhere else), window.storage is undefined — calling it directly     */
/*  throws immediately and silently breaks buttons like "Build my path"   */
/*  (the screen-change line right after the storage call never runs).     */
/*  This wrapper falls back to localStorage so the app works everywhere.  */
/* ---------------------------------------------------------------------- */
const safeStorage = {
  async get(key) {
    try {
      if (window.storage && typeof window.storage.get === "function") {
        return await window.storage.get(key);
      }
    } catch (e) { /* fall through to localStorage */ }
    try {
      const v = localStorage.getItem(key);
      return v === null ? null : { key, value: v };
    } catch (e) { return null; }
  },
  async set(key, value) {
    try {
      if (window.storage && typeof window.storage.set === "function") {
        return await window.storage.set(key, value);
      }
    } catch (e) { /* fall through to localStorage */ }
    try { localStorage.setItem(key, value); } catch (e) { /* ignore */ }
    return null;
  },
  async delete(key) {
    try {
      if (window.storage && typeof window.storage.delete === "function") {
        return await window.storage.delete(key);
      }
    } catch (e) { /* fall through to localStorage */ }
    try { localStorage.removeItem(key); } catch (e) { /* ignore */ }
    return null;
  }
};

/*  CLAUDE API HELPER (real calls, no key needed in this environment)     */
/* ---------------------------------------------------------------------- */
async function askClaude(systemPrompt, userText) {
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 500,
        system: systemPrompt,
        messages: [{role:"user", content: userText}],
      })
    });
    const data = await res.json();
    if (data && data.content) {
      const textBlock = data.content.find(c => c.type === "text");
      if (textBlock) return textBlock.text;
    }
    return null;
  } catch(e) {
    return null;
  }
}

  const [hours, setHours] = useState(6);

  const levels = [
    {key:"beginner", label:t.levelBeginner},
    {key:"intermediate", label:t.levelIntermediate},
    {key:"advanced", label:t.levelAdvanced},
  ];

  const steps = [
    { valid: name.trim().length>0 },
    { valid: !!pathKey },
    { valid: !!level },
    { valid: true },
  ];

  const next = () => {
    if (step < 3) setStep(step+1);
    else onDone({name, pathKey, level, hours});
  };

  // Fix: selecting a path card must give instant feedback AND move the
  // student straight into the next step, instead of silently updating
  // state with no visible response (that was the "not working" bug).
  const choosePathAndAdvance = (k) => {
    setPathKey(k);
    setTimeout(() => setStep(2), 450);
  };

  return (
    <div className="min-h-screen bg-[var(--parchment)] px-5 py-8 sm:py-12">
      <div className={"mx-auto " + (step===1 ? "max-w-4xl" : "max-w-xl")}>
        <div className="flex items-center justify-between mb-8">
          <Logo />
          <span className="text-xs font-semibold text-[var(--muted)]">{t.obStep} {step+1}/4</span>
        </div>

        <div className="progress mb-8" style={{height:"6px", borderRadius:"999px", background:"rgba(0,0,0,0.05)"}}>
          <div className="progress-bar" role="progressbar" style={{width:`${(step+1)/4*100}%`, background:"linear-gradient(90deg,var(--marigold),var(--teal))", transition:"width .5s ease"}}
            aria-valuenow={(step+1)/4*100} aria-valuemin="0" aria-valuemax="100"></div>
        </div>

        <h2 className={"font-display font-bold text-2xl mb-1 " + (lang==="te"?"font-te":"")}>{t.obTitle}</h2>
        <p className={"text-sm text-[var(--muted)] mb-8 " + (lang==="te"?"font-te":"")}>{t.obSub}</p>

        <div className="fade-in" key={step}>
          {step === 0 && (
            <div className="max-w-xl">
              <label className={"block text-sm font-semibold mb-3 " + (lang==="te"?"font-te":"")}>{t.obNameQ}</label>
              <input value={name} onChange={e=>setName(e.target.value)} placeholder={t.obNamePlaceholder}
                className="w-full border border-black/10 rounded-xl px-4 py-3.5 text-base bg-white focus:border-[var(--teal)]" autoFocus />
            </div>
          )}
          {step === 1 && (
            <div>
              <label className={"block text-sm font-semibold mb-1 " + (lang==="te"?"font-te":"")}>{t.obCareerQ}</label>
              <p className={"text-xs text-[var(--muted)] mb-4 " + (lang==="te"?"font-te":"")}>{t.obCareerSub}</p>
              {pathKey && (
                <div className="flex items-center gap-2 mb-4 bg-[var(--teal)]/10 border border-[var(--teal)]/25 rounded-xl px-4 py-2.5 fade-in">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="var(--teal-deep)" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"/></svg>
                  <span className={"text-xs font-semibold text-[var(--teal-deep)] " + (lang==="te"?"font-te":"")}>{t.obPathConfirmed}: {lang==="te" ? PATHS[pathKey].title_te : PATHS[pathKey].title_en} — {lang==="te" ? "తదుపరి దశకు వెళ్తోంది…" : "taking you to the next step…"}</span>
                </div>
              )}
              <ExplorePaths lang={lang} embedded selectedKey={pathKey} onChoose={choosePathAndAdvance} onBack={()=>{}} setLang={()=>{}} />
            </div>
          )}
          {step === 2 && (
            <div className="max-w-xl">
              <label className={"block text-sm font-semibold mb-3 " + (lang==="te"?"font-te":"")}>{t.obLevelQ}</label>
              <div className="flex flex-col gap-3">
                {levels.map(l => (
                  <button key={l.key} onClick={()=>setLevel(l.key)}
                    className={"text-left p-4 rounded-xl border-2 transition-all " + (level===l.key ? "border-[var(--teal)] bg-[var(--teal)]/5" : "border-black/10 bg-white hover:border-black/20")}>
                    <span className={"font-semibold text-sm " + (lang==="te"?"font-te":"")}>{l.label}</span>
                  </button>
                ))}
              </div>
            </div>
          )}
          {step === 3 && (
            <div className="max-w-xl">
              <label className={"block text-sm font-semibold mb-1 " + (lang==="te"?"font-te":"")}>{t.obHoursQ}</label>
              <p className={"text-xs text-[var(--muted)] mb-5 " + (lang==="te"?"font-te":"")}>{t.obHoursSub}</p>
              <div className="bg-white border border-black/10 rounded-xl p-5">
                <div className="text-center mb-4">
                  <span className="font-display font-extrabold text-4xl" style={{color:"var(--marigold-deep)"}}>{hours}</span>
                  <span className="text-sm text-[var(--muted)] ml-2">{t.weekHours}</span>
                </div>
                <input type="range" min="2" max="20" value={hours} onChange={e=>setHours(Number(e.target.value))}
                  className="form-range w-full accent-[var(--teal)]" />
                <div className="flex justify-between text-xs text-[var(--muted)] mt-1"><span>2</span><span>20</span></div>
              </div>
            </div>
          )}
        </div>

        <div className={step===1 ? "max-w-4xl" : "max-w-xl"}>
          <button disabled={!steps[step].valid} onClick={next}
            className="btn w-full mt-8 py-3.5 rounded-xl font-bold text-white disabled:opacity-40 transition-opacity"
            style={{background:"var(--teal)"}}>
            {step === 3 ? t.finishBtn : t.continueBtn}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/*  SUGGESTED LEARNING WEBSITES                                           */
/*  Builds a short list of well-known learning platforms deep-linked to   */
/*  this exact topic, so a student always has more than one place to go. */
/* ---------------------------------------------------------------------- */
function suggestedResources(node, lang) {
  if (!node) return [];
  const title = lang === "te" ? node.title_te : node.title_en;
  const q = encodeURIComponent(node.title_en); // keep search queries in English for best hit-rate
  const list = [];
  if (node.type === "external" && node.link) {
    list.push({ name_en: "Recommended lesson", name_te: "సిఫార్సు చేయబడిన పాఠం", url: node.link, primary: true });
  }
  list.push(
    { name_en: "GeeksforGeeks", name_te: "GeeksforGeeks", url: `https://www.geeksforgeeks.org/?s=${q}` },
    { name_en: "YouTube tutorials", name_te: "YouTube ట్యుటోరియల్స్", url: `https://www.youtube.com/results?search_query=${q}+tutorial` },
    { name_en: "NPTEL / Swayam", name_te: "NPTEL / Swayam", url: `https://nptel.ac.in/course.html` },
    { name_en: "freeCodeCamp", name_te: "freeCodeCamp", url: `https://www.freecodecamp.org/news/search/?query=${q}` },
  );
  return list;
}

function QuizModal({lang, questions, onClose, onFinish, currentNodeTitle}) {
  const t = T[lang];
  const [answers, setAnswers] = useState({});
  const [phase, setPhase] = useState("quiz");
  const [remedialText, setRemedialText] = useState("");

  const mcqs = questions.filter(q => q.options);

  const submit = async () => {
    let correct = 0;
    mcqs.forEach((q, i) => { if (answers[i] === q.answer) correct++; });
    const pct = mcqs.length ? correct / mcqs.length : 1;
    if (pct >= 0.6) {
      setPhase("result-pass");
    } else {
      setPhase("generating");
      const sys = lang === "te"
        ? "మీరు గ్రామీణ ఆంధ్రప్రదేశ్ ఇంజనీరింగ్ విద్యార్థుల కోసం ఒక ప్రశాంతమైన, ప్రోత్సాహకరమైన AI మెంటార్. విద్యార్థి ఒక క్విజ్‌లో విఫలమయ్యారు. తెలుగులో, 4-5 వాక్యాలలో, సరళంగా, తీర్పు తీర్చకుండా, ఒక చిన్న క్యాచ్-అప్ వివరణ ఇవ్వండి."
        : "You are a calm, encouraging AI mentor for rural Andhra Pradesh engineering students. The student just failed a short quiz on a topic. In plain English, in 4-5 sentences, give a short, non-judgmental catch-up explanation of the core idea they likely missed, ending with one word of encouragement.";
      const userMsg = `Topic: ${currentNodeTitle}. Give a short remedial explanation.`;
      const res = await askClaude(sys, userMsg);
      setRemedialText(res || (lang === "te" ? "పర్వాలేదు, మళ్లీ ప్రయత్నిద్దాం. ఈ టాపిక్‌ను చిన్న భాగాలుగా విడగొట్టి మళ్లీ చూద్దాం." : "No worries — let's break this topic into smaller pieces and go through it again, one idea at a time."));
      setPhase("result-fail");
    }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40 px-0 sm:px-5">
      <div className="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 max-h-[88vh] overflow-y-auto scrollbar-none fade-in">
        {phase === "quiz" && (
          <React.Fragment>
            <h3 className={"font-display font-bold text-xl mb-1 " + (lang==="te"?"font-te":"")}>{t.quizTitle}</h3>
            <p className={"text-sm text-[var(--muted)] mb-6 " + (lang==="te"?"font-te":"")}>{t.quizSub}</p>
            {mcqs.length === 0 ? (
              <p className={"text-sm text-[var(--muted)] mb-6 " + (lang==="te"?"font-te":"")}>
                {lang==="te" ? "ఈ టాపిక్‌కు క్విజ్ లేదు — నేరుగా కొనసాగించవచ్చు." : "No quiz questions for this topic yet — you can continue directly."}
              </p>
            ) : (
              <div className="flex flex-col gap-5 mb-6">
                {mcqs.map((q, i) => (
                  <div key={i}>
                    <p className={"font-semibold text-sm mb-2.5 " + (lang==="te"?"font-te":"")}>{i+1}. {lang==="te" ? q.q_te : q.q_en}</p>
                    <div className="flex flex-col gap-2">
                      {q.options.map((opt, oi) => (
                        <button key={oi} onClick={() => setAnswers({...answers, [i]: oi})}
                          className={"text-left px-3.5 py-2.5 rounded-lg border text-sm transition-all " + (answers[i]===oi ? "border-[var(--teal)] bg-[var(--teal)]/5 font-semibold" : "border-black/10 hover:border-black/20")}>
                          {opt}
                        </button>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}
            <button onClick={submit} disabled={Object.keys(answers).length < mcqs.length}
              className="w-full py-3.5 rounded-xl font-bold text-white disabled:opacity-40" style={{background:"var(--teal)"}}>
              {t.submitQuiz}
            </button>
          </React.Fragment>
        )}

        {phase === "generating" && (
          <div className="py-10 text-center">
            <div className="w-10 h-10 border-4 border-[var(--marigold)]/30 border-t-[var(--marigold)] rounded-full animate-spin mx-auto mb-5"></div>
            <p className={"text-sm font-semibold text-[var(--muted)] " + (lang==="te"?"font-te":"")}>{t.generatingHelp}</p>
          </div>
        )}

        {phase === "result-pass" && (
          <div className="py-4 text-center">
            <div className="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4" style={{background:"rgba(31,122,108,0.12)"}}>
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="var(--teal)" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </div>
            <h3 className={"font-display font-bold text-xl mb-2 " + (lang==="te"?"font-te":"")}>{t.quizResultPassTitle}</h3>
            <p className={"text-sm text-[var(--muted)] mb-7 " + (lang==="te"?"font-te":"")}>{t.quizResultPassSub}</p>
            <button onClick={() => onFinish(true, null)} className="w-full py-3.5 rounded-xl font-bold text-white" style={{background:"var(--teal)"}}>
              {t.continueDash}
            </button>
          </div>
        )}

        {phase === "result-fail" && (
          <div className="py-2">
            <div className="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4" style={{background:"rgba(232,163,61,0.14)"}}>
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 8v5m0 3h.01" stroke="var(--marigold-deep)" strokeWidth="2.4" strokeLinecap="round"/><circle cx="12" cy="12" r="9" stroke="var(--marigold-deep)" strokeWidth="1.8"/></svg>
            </div>
            <h3 className={"font-display font-bold text-xl mb-2 text-center " + (lang==="te"?"font-te":"")}>{t.quizResultFailTitle}</h3>
            <p className={"text-sm text-[var(--muted)] mb-4 text-center " + (lang==="te"?"font-te":"")}>{t.quizResultFailSub}</p>
            <div className="bg-black/[0.03] rounded-xl p-4 mb-6">
              <p className={"text-sm leading-relaxed " + (lang==="te"?"font-te":"")}>{remedialText}</p>
            </div>
            <button onClick={() => onFinish(false, remedialText)} className="w-full py-3.5 rounded-xl font-bold text-white" style={{background:"var(--teal)"}}>
              {t.continueDash}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/*  CHATBOT (omnipresent FAB + panel)                                     */
/* ---------------------------------------------------------------------- */
function Chatbot({lang, user, currentNode, lastScore, history, setHistory}) {
  const t = T[lang];
  const [open, setOpen] = useState(false);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [listening, setListening] = useState(false);
  const [micSupported, setMicSupported] = useState(true);
  const recognitionRef = useRef(null);
  const scrollRef = useRef(null);

  useEffect(() => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setMicSupported(false); return; }
    const rec = new SR();
    rec.continuous = false;
    rec.interimResults = false;
    rec.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      setInput(prev => (prev ? prev + " " : "") + transcript);
    };
    rec.onend = () => setListening(false);
    rec.onerror = () => setListening(false);
    recognitionRef.current = rec;
  }, [lang]);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [history, open, loading]);

  const toggleMic = () => {
    if (!micSupported || !recognitionRef.current) return;
    if (listening) {
      recognitionRef.current.stop();
      setListening(false);
    } else {
      recognitionRef.current.lang = lang === "te" ? "te-IN" : "en-IN";
      recognitionRef.current.start();
      setListening(true);
    }
  };

  const send = async () => {
    if (!input.trim() || loading) return;
    const userMsg = input.trim();
    const newHistory = [...history, {role:"user", text:userMsg}];
    setHistory(newHistory);
    setInput("");
    setLoading(true);

    const nodeTitle = currentNode ? (lang==="te" ? currentNode.title_te : currentNode.title_en) : "—";
    const sys = (lang === "te"
      ? `మీరు 'స్కై రూట్' — గ్రామీణ ఆంధ్రప్రదేశ్ ఇంజనీరింగ్ విద్యార్థుల కోసం ఒక వెచ్చని, ఓపికగల AI మెంటార్. విద్యార్థి పేరు ${user.name}. వారి లక్ష్యం: ${user.careerLabel}. వారి స్థాయి: ${user.level}. ప్రస్తుతం చదువుతున్న టాపిక్: ${nodeTitle}. చివరి క్విజ్ స్కోరు: ${lastScore==null?"లేదు":Math.round(lastScore*100)+"%"}. తెలుగు, ఇంగ్లీష్ లేదా రెండూ కలిపిన (Tanglish) ప్రశ్నలకు సహజంగా సమాధానం ఇవ్వండి. చిన్నగా, స్పష్టంగా, ప్రోత్సాహకరంగా సమాధానం ఇవ్వండి — 5-6 వాక్యాల లోపు.`
      : `You are 'Sky Route' — a warm, patient AI mentor for a rural Andhra Pradesh engineering student named ${user.name}. Their goal: ${user.careerLabel}. Their level: ${user.level}. They are currently on the topic: "${nodeTitle}". Last quiz score: ${lastScore==null?"not taken yet":Math.round(lastScore*100)+"%"}. Answer naturally even if they mix Telugu and English (Tanglish). Keep answers short, clear, and encouraging — under 6 sentences. Never make the student feel behind or stupid.`);

    const res = await askClaude(sys, userMsg);
    const replyText = res || (lang==="te" ? "క్షమించండి, ఇప్పుడు కనెక్ట్ కాలేకపోతున్నాను. దయచేసి మళ్లీ ప్రయత్నించండి." : "Sorry, I couldn't connect just now. Please try again in a moment.");
    setHistory([...newHistory, {role:"assistant", text: replyText}]);
    setLoading(false);
  };

  const nodeTitle = currentNode ? (lang==="te" ? currentNode.title_te : currentNode.title_en) : null;

  return (
    <React.Fragment>
      <button onClick={() => setOpen(!open)}
        className="fixed bottom-5 right-5 z-40 w-16 h-16 rounded-full shadow-2xl flex items-center justify-center pulse-ring transition-transform hover:scale-105"
        style={{background:"linear-gradient(135deg,var(--marigold),var(--teal))"}}>
        {open ? (
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="white" strokeWidth="2.4" strokeLinecap="round"/></svg>
        ) : (
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 4h16v11H8l-4 4V4z" stroke="white" strokeWidth="2" strokeLinejoin="round"/><circle cx="9" cy="9.5" r="1" fill="white"/><circle cx="12" cy="9.5" r="1" fill="white"/><circle cx="15" cy="9.5" r="1" fill="white"/></svg>
        )}
      </button>

      {open && (
        <div className="fixed bottom-24 right-5 left-5 sm:left-auto z-40 sm:w-96 h-[68vh] sm:h-[560px] bg-white rounded-3xl shadow-2xl border border-black/5 flex flex-col overflow-hidden fade-in">
          <div className="px-5 py-4 flex items-center gap-3 border-b border-black/5" style={{background:"var(--night)"}}>
            <div className="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0" style={{background:"var(--marigold)"}}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 18c4-8 8-8 16-14M4 18c2-2 4-3 6-3M20 4c-1 3-2 5-3 7" stroke="var(--night)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </div>
            <div className="flex-1 min-w-0">
              <div className={"text-white font-display font-bold text-sm " + (lang==="te"?"font-te":"")}>{t.chatTitle}</div>
              {nodeTitle && <div className="text-white/50 text-[11px] truncate">{t.chatContext} {nodeTitle}</div>}
            </div>
          </div>

          <div ref={scrollRef} className="flex-1 overflow-y-auto px-4 py-4 flex flex-col gap-3 bg-[var(--parchment)]">
            {history.length === 0 && (
              <div className={"text-center text-xs text-[var(--muted)] mt-8 px-6 " + (lang==="te"?"font-te":"")}>{t.chatEmpty}</div>
            )}
            {history.map((m, i) => (
              <div key={i} className={"max-w-[85%] px-3.5 py-2.5 rounded-2xl text-sm leading-relaxed " + (m.role==="user" ? "self-end text-white rounded-br-md" : "self-start bg-white border border-black/5 rounded-bl-md") + (lang==="te"?" font-te":"")}
                style={m.role==="user" ? {background:"var(--teal)"} : {}}>
                {m.text}
              </div>
            ))}
            {loading && (
              <div className="self-start bg-white border border-black/5 rounded-2xl rounded-bl-md px-3.5 py-2.5 text-xs text-[var(--muted)]">{t.thinking}</div>
            )}
          </div>

          {!micSupported && (
            <div className="px-4 py-1.5 text-[10px] text-[var(--muted)] bg-black/[0.02] border-t border-black/5">{t.micUnsupported}</div>
          )}
          {listening && (
            <div className="px-4 py-1.5 text-[10px] font-semibold text-[var(--coral)] bg-[var(--coral)]/5 border-t border-black/5">{t.listening}</div>
          )}

          <div className="p-3 border-t border-black/5 flex items-center gap-2 bg-white">
            <button onClick={toggleMic} disabled={!micSupported}
              className={"w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 transition-colors disabled:opacity-30 " + (listening ? "mic-active" : "")}
              style={{background: listening ? "var(--coral)" : "rgba(31,122,108,0.1)"}}>
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
                <path d="M12 15a3 3 0 003-3V6a3 3 0 00-6 0v6a3 3 0 003 3z" stroke={listening?"white":"var(--teal)"} strokeWidth="1.8"/>
                <path d="M19 11a7 7 0 01-14 0M12 18v3" stroke={listening?"white":"var(--teal)"} strokeWidth="1.8" strokeLinecap="round"/>
              </svg>
            </button>
            <input value={input} onChange={e=>setInput(e.target.value)}
              onKeyDown={e => { if (e.key==="Enter") send(); }}
              placeholder={t.chatPlaceholder}
              className={"flex-1 text-sm bg-black/[0.03] rounded-full px-4 py-2.5 " + (lang==="te"?"font-te":"")} />
            <button onClick={send} disabled={!input.trim()||loading}
              className="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 disabled:opacity-30" style={{background:"var(--marigold)"}}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 12l16-8-6 8 6 8-16-8z" stroke="var(--night)" strokeWidth="1.6" strokeLinejoin="round" fill="var(--night)"/></svg>
            </button>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

/* ---------------------------------------------------------------------- */
/*  DASHBOARD                                                             */
/* ---------------------------------------------------------------------- */
function Dashboard({lang, setLang, user, roadmap, setRoadmap, onSignOut, onExplore}) {
  const t = T[lang];
  const [activeNode, setActiveNode] = useState(null);
  const [quizOpen, setQuizOpen] = useState(false);
  const [lastScore, setLastScore] = useState(null);
  const [chatHistory, setChatHistory] = useState([]);
  const [visited, setVisited] = useState({});

  useEffect(() => {
    (async () => {
      try {
        const saved = await safeStorage.get("skyroute:visited");
        if (saved && saved.value) setVisited(JSON.parse(saved.value));
      } catch (e) { /* nothing tracked yet */ }
    })();
  }, []);

  const trackVisit = (nodeId) => {
    setVisited(prev => {
      const next = {...prev, [nodeId]: true};
      safeStorage.set("skyroute:visited", JSON.stringify(next)).catch(()=>{});
      return next;
    });
  };

  const doneCount = roadmap.filter(n => n.status === "done").length;
  const pct = Math.round((doneCount / roadmap.length) * 100);
  const currentNode = roadmap.find(n => n.status === "available") || roadmap.find(n=>n.status==="done") || roadmap[0];

  const markComplete = (id) => {
    setRoadmap(prev => {
      const idx = prev.findIndex(n => n.id === id);
      const next = prev.map((n,i) => {
        if (n.id === id) return {...n, status:"done"};
        if (i === idx+1 && n.status === "locked") return {...n, status:"available"};
        return n;
      });
      return next;
    });
    setActiveNode(prev => prev ? {...prev, status:"done"} : prev);
  };

  const quizAvailable = doneCount > 0 && doneCount % 2 === 0 && doneCount < roadmap.length;
  const quizQuestions = useMemo(() => {
    if (!currentNode) return QUIZ_BANK.default;
    return QUIZ_BANK[currentNode.id] || QUIZ_BANK.default;
  }, [currentNode]);

  const handleQuizFinish = (passed, remedialText) => {
    setLastScore(passed ? 1 : 0.3);
    if (!passed) {
      setRoadmap(prev => {
        const idx = prev.findIndex(n => n.status === "available");
        const insertAt = idx === -1 ? prev.length : idx;
        const remedialNode = {
          id: "remedial-" + Date.now(),
          title_en: "Catch-up: " + (currentNode ? currentNode.title_en : ""),
          title_te: "క్యాచ్-అప్: " + (currentNode ? currentNode.title_te : ""),
          type: "internal",
          desc_en: remedialText || "A short focused lesson to close the gap before you move forward.",
          desc_te: remedialText || "ముందుకు వెళ్లే ముందు గ్యాప్‌ను పూరించడానికి ఒక చిన్న ఫోకస్డ్ పాఠం.",
          status: "available",
          remedial: true,
        };
        const copy = [...prev];
        copy.splice(insertAt, 0, remedialNode);
        return copy;
      });
    }
    setQuizOpen(false);
  };

  return (
    <div className="min-h-screen bg-[var(--parchment)] pb-32">
      <nav className="navbar navbar-light bg-white sticky-top shadow-sm border-bottom">
        <div className="container-md d-flex align-items-center justify-content-between gap-2 py-2">
          <Logo />
          <div className="d-flex align-items-center gap-1">
            <button onClick={onExplore} className="btn btn-light btn-sm rounded-pill d-none d-sm-flex align-items-center gap-1.5">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
              {t.explorePaths}
            </button>
            <LangSwitch lang={lang} setLang={setLang} />
            <button onClick={onSignOut} className="btn btn-light btn-sm rounded-pill">
              {t.signOut}
            </button>
          </div>
        </div>
      </nav>

      <main className="container-md px-3 pt-4">
        <div className="fade-in mb-4">
          <h1 className={"font-display font-extrabold display-6 mb-1 " + (lang==="te"?"font-te":"")}>{t.dashGreeting}, {user.name} 👋</h1>
          <p className={"text-sm text-[var(--muted)] " + (lang==="te"?"font-te":"")}>{t.dashSub}</p>
        </div>

        <div className="row g-3 mb-3">
          <div className="col-6">
            <div className="bg-white rounded-2xl border border-black/5 p-4 h-100">
              <div className={"text-xs font-semibold text-[var(--muted)] mb-1.5 " + (lang==="te"?"font-te":"")}>{t.progress}</div>
              <div className="flex items-end gap-2">
                <span className="font-display font-extrabold text-3xl" style={{color:"var(--teal-deep)"}}>{pct}%</span>
                <span className={"text-xs text-[var(--muted)] mb-1 " + (lang==="te"?"font-te":"")}>{doneCount}/{roadmap.length} {t.nodesDone}</span>
              </div>
              <div className="progress mt-2.5" style={{height:"8px", borderRadius:"999px", background:"rgba(0,0,0,0.05)"}}>
                <div className="progress-bar" role="progressbar" style={{width:`${pct}%`, background:"var(--teal)", transition:"width .5s ease"}}
                  aria-valuenow={pct} aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            </div>
          </div>
          <div className="col-6">
            <div className="bg-white rounded-2xl border border-black/5 p-4 h-100 flex flex-col justify-between">
              <div className={"text-xs font-semibold text-[var(--muted)] mb-1.5 " + (lang==="te"?"font-te":"")}>{user.careerLabel}</div>
              <div className="badge d-inline-flex items-center gap-1.5 text-[11px] font-semibold px-2 py-1 rounded-full bg-black/5 w-fit">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="var(--teal)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
                <span className={lang==="te"?"font-te":""}>{t.offlineBadge}</span>
              </div>
            </div>
          </div>
        </div>

        {quizAvailable && (
          <button onClick={() => setQuizOpen(true)} className="btn w-full mb-6 text-left rounded-2xl p-4 flex items-center gap-4 border transition-transform hover:scale-[1.01]"
            style={{background:"linear-gradient(135deg, rgba(232,163,61,0.12), rgba(31,122,108,0.10))", borderColor:"rgba(232,163,61,0.3)"}}>
            <div className="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0" style={{background:"var(--marigold)"}}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9 11l3 3L22 4M2 12a10 10 0 1010-10" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </div>
            <div className="flex-1">
              <div className={"font-display font-bold text-sm " + (lang==="te"?"font-te":"")}>{t.weeklyCheck}</div>
              <div className={"text-xs text-[var(--muted)] " + (lang==="te"?"font-te":"")}>{t.weeklyCheckSub}</div>
            </div>
            <span className="badge text-xs font-bold px-3 py-2 rounded-full text-white flex-shrink-0" style={{background:"var(--marigold-deep)"}}>{t.startQuiz}</span>
          </button>
        )}

        <div className="flex items-center justify-between mb-4">
          <h2 className={"font-display font-bold text-lg " + (lang==="te"?"font-te":"")}>{t.yourPath}</h2>
          <button onClick={onExplore} className="sm:hidden text-xs font-semibold text-[var(--teal-deep)]">{t.explorePaths}</button>
        </div>
        <RoadmapPath lang={lang} nodes={roadmap} onOpen={setActiveNode} />

        <div className={"text-center text-xs text-[var(--muted)] mt-10 mb-2 " + (lang==="te"?"font-te":"")}>{t.footerTag}</div>
      </main>

      <TopicModal lang={lang} node={activeNode} onClose={()=>setActiveNode(null)} onComplete={(id)=>{markComplete(id); }} onVisit={trackVisit} visited={visited} />
      {quizOpen && (
        <QuizModal lang={lang} questions={quizQuestions} currentNodeTitle={currentNode ? (lang==="te"?currentNode.title_te:currentNode.title_en) : ""}
          onClose={()=>setQuizOpen(false)} onFinish={handleQuizFinish} />
      )}

      <Chatbot lang={lang} user={user} currentNode={currentNode} lastScore={lastScore} history={chatHistory} setHistory={setChatHistory} />
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/*  ROOT APP                                                              */
/* ---------------------------------------------------------------------- */
function App() {
  const [lang, setLang] = useState("en");
  const [screen, setScreen] = useState("landing"); // landing | explore | auth | onboarding | dashboard
  const [prevScreen, setPrevScreen] = useState("landing");
  const [pendingPath, setPendingPath] = useState(null);
  const [user, setUser] = useState(null);
  const [roadmap, setRoadmap] = useState([]);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const saved = await safeStorage.get("skyroute:session");
        if (saved && saved.value) {
          const parsed = JSON.parse(saved.value);
          setUser(parsed.user);
          setRoadmap(parsed.roadmap);
          setLang(parsed.lang || "en");
          setScreen("dashboard");
        }
      } catch (e) { /* no session yet */ }
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (screen === "dashboard" && user) {
      safeStorage.set("skyroute:session", JSON.stringify({user, roadmap, lang})).catch(()=>{});
    }
  }, [roadmap, lang]);

  const buildRoadmap = (pathKey, level) => {
    const path = PATHS[pathKey];
    const skipCount = level === "advanced" ? 2 : level === "intermediate" ? 1 : 0;
    return path.nodes.map((n, i) => ({
      ...n,
      status: i < skipCount ? "done" : i === skipCount ? "available" : "locked",
    }));
  };

  const finishOnboarding = ({name, pathKey, level, hours}) => {
    const path = PATHS[pathKey];
    const careerLabel = lang === "te" ? path.title_te : path.title_en;
    const newUser = { name, pathKey, careerLabel, level, hours };
    const rm = buildRoadmap(pathKey, level);
    setUser(newUser);
    setRoadmap(rm);
    setScreen("dashboard");
    safeStorage.set("skyroute:session", JSON.stringify({user:newUser, roadmap:rm, lang})).catch(()=>{});
  };

  const handleChoosePath = (pathKey) => {
    if (user) {
      // Logged-in user switching paths from the dashboard
      const path = PATHS[pathKey];
      const careerLabel = lang === "te" ? path.title_te : path.title_en;
      const level = user.level || "beginner";
      const newUser = {...user, pathKey, careerLabel};
      const rm = buildRoadmap(pathKey, level);
      setUser(newUser);
      setRoadmap(rm);
      setScreen("dashboard");
      safeStorage.set("skyroute:session", JSON.stringify({user:newUser, roadmap:rm, lang})).catch(()=>{});
    } else {
      setPendingPath(pathKey);
      setScreen("auth");
    }
  };

  const signOut = () => {
    safeStorage.delete("skyroute:session").catch(()=>{});
    setUser(null);
    setRoadmap([]);
    setPendingPath(null);
    setScreen("landing");
  };

  if (!loaded) return null;

  if (screen === "landing") return <Landing lang={lang} setLang={setLang} onStart={setScreen} onExplore={()=>setScreen("explore")} />;

  if (screen === "explore") return (
    <ExplorePaths lang={lang} setLang={setLang} onChoose={handleChoosePath} onBack={()=>setScreen(user ? "dashboard" : "landing")} />
  );

  if (screen === "auth") return <Auth lang={lang} onBack={()=>setScreen(pendingPath ? "explore" : "landing")} onDone={()=>setScreen("onboarding")} />;

  if (screen === "onboarding") return <Onboarding lang={lang} initialPathKey={pendingPath} onDone={finishOnboarding} />;

  if (screen === "dashboard" && user) return (
    <Dashboard lang={lang} setLang={setLang} user={user} roadmap={roadmap} setRoadmap={setRoadmap} onSignOut={signOut} onExplore={()=>setScreen("explore")} />
  );

  return <Landing lang={lang} setLang={setLang} onStart={setScreen} onExplore={()=>setScreen("explore")} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
